<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Task</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>Edit Task</h1>
        <p>Update your task information.</p>
    </header>

    <section class="card">

        <form th:action="@{/tasks/update/{id}(id=${task.id})}"
              method="post"
              class="task-form">

            <input type="text"
                   name="title"
                   th:value="${task.title}"
                   placeholder="Task title"
                   required>

            <input type="text"
                   name="description"
                   th:value="${task.description}"
                   placeholder="Task description"
                   required>

            <select name="priority">
                <option value="LOW"
                        th:selected="${task.priority == 'LOW'}">
                    Low
                </option>

                <option value="MEDIUM"
                        th:selected="${task.priority == 'MEDIUM'}">
                    Medium
                </option>

                <option value="HIGH"
                        th:selected="${task.priority == 'HIGH'}">
                    High
                </option>
            </select>

            <input type="date"
                   name="dueDate"
                   th:value="${task.dueDate}">

            <div style="display:flex; align-items:center; gap:10px;">
                <label>Completed</label>

                <input type="hidden"
                       name="completed"
                       value="false">

                <input type="checkbox"
                       name="completed"
                       value="true"
                       th:checked="${task.completed}">
            </div>

            <button type="submit" class="btn btn-primary">
                Update Task
            </button>

        </form>

        <br>

        <a href="/" class="btn btn-edit">
            Back to Task List
        </a>

    </section>

</div>

</body>
</html>
