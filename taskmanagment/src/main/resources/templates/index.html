<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task Management</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>Task Management</h1>
        <p>Organize your tasks and track your progress.</p>
    </header>

    <section class="card">
        <h2>Add New Task</h2>

        <form action="/tasks/create" method="post" class="task-form">
            <input type="text" name="title" placeholder="Task title" required>

            <input type="text" name="description" placeholder="Task description" required>

            <select name="priority">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
            </select>

            <input type="date" name="dueDate">

            <button type="submit" class="btn btn-primary">Add Task</button>
        </form>
    </section>

    <section class="card">

        <form action="/" method="get" class="task-form">
            <input type="text"
                   name="keyword"
                   placeholder="Search by title"
                   th:value="${keyword}">

            <button type="submit" class="btn btn-primary">Search</button>

            <a href="/" class="btn btn-edit">Clear</a>
        </form>

        <div class="filter-buttons">
            <a th:href="@{/(status='all')}" class="btn btn-edit">All</a>
            <a th:href="@{/(status='completed')}" class="btn btn-toggle">Completed</a>
            <a th:href="@{/(status='pending')}" class="btn btn-delete">Pending</a>
            <a th:href="@{/(status='high')}" class="btn btn-primary">High Priority</a>
        </div>

        <h2>Your Tasks</h2>

        <table class="task-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="task : ${tasks}"
                th:classappend="${task.completed} ? ' completed' : ''">

                <td th:text="${task.id}"></td>
                <td th:text="${task.title}"></td>
                <td th:text="${task.description}"></td>
                <td th:text="${task.priority}"></td>
                <td th:text="${task.dueDate}"></td>

                <td>
                    <span th:text="${task.completed} ? 'Completed' : 'Pending'"
                          th:class="${task.completed} ? 'status completed-status' : 'status pending-status'">
                    </span>
                </td>

                <td class="actions">
                    <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-edit">
                        Edit
                    </a>

                    <form th:action="@{/tasks/toggle/{id}(id=${task.id})}" method="post">
                        <button type="submit"
                                class="btn btn-toggle"
                                th:text="${task.completed} ? 'Undo' : 'Complete'">
                        </button>
                    </form>

                    <form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post">
                        <button type="submit" class="btn btn-delete">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="empty-message" th:if="${#lists.isEmpty(tasks)}">
            No tasks yet. Add your first task above.
        </p>
    </section>

</div>

</body>
</html>
